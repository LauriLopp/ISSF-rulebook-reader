[project]
name = "issf-rules"
version = "0.1.0"
description = "Document-preparation pipeline for the ISSF rulebook assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pymupdf>=1.28.2,<1.29",
]

[project.scripts]
issf-rules = "issf_rules.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issf_rules"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["issf_rules"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF's API is only partly annotated; only these packages talk to it.
module = ["issf_rules.extract.*", "issf_rules.review.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_pdf: needs the real rulebook PDF in data/raw (skipped when missing)"]

[tool.uv]
# Resolve only releases at least two weeks old (supply-chain hygiene, reproducible locks).
# Move this date forward deliberately when upgrading dependencies.
exclude-newer = "2026-10-12T00:00:00Z"
